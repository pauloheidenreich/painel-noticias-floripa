name: Atualizar painel (GitHub Pages)
on:
  schedule:
    - cron: '4-59/15 * * * *'   # a cada 15 min (minutos 04, 19, 34, 49; fora do :00 para reduzir atrasos do GitHub)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/coletar.js
        env:
          CMF_TOKEN: ${{ secrets.CMF_TOKEN }}
      - run: mkdir -p _site && cp index.html noticias.json novidades.json _site/ && cp static/* _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
